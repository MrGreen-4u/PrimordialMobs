buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        jcenter()
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'org.parchmentmc.librarian.forgegradle' version '1.+' apply false
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

version = '2.11.0'
group = 'com.primordialmobs'
archivesBaseName = 'primordialmobs'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')


    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            arg "-mixin.config=" + "citadel.mixins.json"
            arg "-mixin.config=" + "primordialmobs.mixins.json"

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                primordialmobs {
                    source sourceSets.main
                }
            }
        }

        server {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config=" + "citadel.mixins.json"
            arg "-mixin.config=" + "primordialmobs.mixins.json"


            property 'forge.logging.console.level', 'debug'

            mods {
                primordialmobs {
                    source sourceSets.main
                }
            }
        }

        data {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config=" + "citadel.mixins.json"
            arg "-mixin.config=" + "primordialmobs.mixins.json"


            property 'forge.logging.console.level', 'debug'

            mods {
                primordialmobs {
                    source sourceSets.main
                }
            }
        }
    }
}
// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation fg.deobf("curse.maven:citadel-331936:6702068")
    // Full Alex's Caves 2.0.2, compile-only: the compat renderers/events (com.primordialmobs.compat)
    // extend its classes. Never on the runtime classpath standalone.
    compileOnly fg.deobf("blank:alexscaves-full:2.0.2")
    // Opt-in for testing COMPAT mode in the dev runs: ./gradlew runClient -PwithAlexsCaves
    // A dedicated server never class-loads the client renderers/models, so the compat CLIENT mixins can
    // only be validated by booting a real client with Alex's Caves actually present.
    if (project.hasProperty('withAlexsCaves')) {
        runtimeOnly fg.deobf("blank:alexscaves-full:2.0.2")
    }
    compileOnly(fg.deobf("mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${jei_mc_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${jei_mc_version}-forge:${jei_version}"))
    runtimeOnly(fg.deobf("curse.maven:spark-361579:4587309"))
}

mixin {
    add sourceSets.main, "citadel.refmap.json"
    add sourceSets.main, "primordialmobs.refmap.json"
    config 'citadel.mixins.json'
    config 'primordialmobs.mixins.json'
}
// Example for how to get properties into the manifest for reading by the runtime..
jar {
    from('LICENSE')
    manifest {
        attributes([
                "Specification-Title"     : "primordialmobs",
                "Specification-Vendor"    : "MrGreen_4u",
                "Specification-Version"   : "${version}",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "MrGreen_4u",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
