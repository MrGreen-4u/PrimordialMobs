[[dependencies.primordialmobs]]
# The base mod this add-on requires. Alex's Caves owns the Primordial Caves and provides every
# creature, block, item, model, animation, sound and texture; Primordial Mobs only layers renames,
# recolored variants, taming/riding, the Sniffer rework and vanilla-archaeology brushing on top.
# The mixins are additionally gated on its presence (PrimordialMixinPlugin) so a missing install
# stops on Forge's dependency screen instead of a mixin error. Tested against Alex's Caves 2.0.2.
modId="alexscaves"
mandatory=true
versionRange="[2.0,)"
ordering="AFTER"
side="BOTH"
